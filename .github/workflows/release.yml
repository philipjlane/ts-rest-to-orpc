name: Release

# Stages a release: verifies, builds and packs the npm tarball, then attaches
# it to the GitHub release for the tag. Publishing to npm is done by hand from
# that tarball (see README, "Publishing").

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to stage (for example v0.1.0)
        required: true
        type: string

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm typecheck:fixtures
      - run: pnpm build
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "package.json is $version but the tag is $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Pack the npm tarball
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ts-rest-to-orpc-*.tgz
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ts-rest-to-orpc-*.tgz --clobber
