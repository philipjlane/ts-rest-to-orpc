name: Release

# Stages a release on npm (https://docs.npmjs.com/staged-publishing): the
# version is uploaded with `npm stage publish`, which needs no 2FA, and a
# maintainer approves it on npmjs.com (Staged Packages tab) or with
# `npm stage approve <stage-id>`. The tarball is also attached to the GitHub
# release for inspection.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to stage (for example v0.1.0)
        required: true
        type: string

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with staged publishing (11.15 or later)
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm typecheck:fixtures
      - run: pnpm build
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "package.json is $version but the tag is $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Pack the npm tarball
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ts-rest-to-orpc-*.tgz
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ts-rest-to-orpc-*.tgz --clobber
      - name: Stage the version on npm
        run: npm stage publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
